name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    lint-and-format:
        name: Lint & Format Check (Node v${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js v${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: v${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

    build:
        name: Build (Node v${{ matrix.node-version }})
        needs: lint-and-format
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js v${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: v${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
