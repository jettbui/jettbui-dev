version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      target-branch: main
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch
      open-pull-requests-limit: 10

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      target-branch: main
      groups:
          github-actions:
              patterns:
                  - "*"
